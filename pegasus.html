<script>
    const filebtn = document.getElementById('fm-btn');

    filebtn.addEventListener('click', () => {
        const filecmd = document.getElementById('fm-select').value;
        const filepath = document.getElementById('fm-path').value.trim()
        const command = '{'+filecmd+':'+filepath+'}\n';

        fetch('http://127.0.0.1/pegasus/cmd.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'data='+command+'&filename=commands.cfg',
        });
        
    });
</script>
