<svg width="640" height="200" viewBox="0 0 640 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">iBoy Technologies logo</title>
  <desc id="desc">A modern tech logo with a rounded square icon and the iBoy Technologies wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F6FAD"/>
      <stop offset="1" stop-color="#0A4D78"/>
    </linearGradient>
    <linearGradient id="accent" x1="38" y1="40" x2="144" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73F6FF"/>
      <stop offset="1" stop-color="#7BE7A3"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="160" height="160" rx="38" fill="url(#bg)"/>
  <rect x="38" y="38" width="124" height="124" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>

  <path d="M80 58V138" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <path d="M80 98H108C118 98 126 92 126 84C126 76 118 70 108 70H80" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 98H109C120 98 128 105 128 114C128 123 120 130 109 130H80" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M134 60L150 78" stroke="rgba(255,255,255,0.72)" stroke-width="8" stroke-linecap="round"/>
  <path d="M134 138L150 120" stroke="rgba(255,255,255,0.72)" stroke-width="8" stroke-linecap="round"/>

  <g fill="#FFFFFF">
    <text x="214" y="124" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="72">iBoy</text>
  </g>
  <g fill="#7BE7A3">
    <text x="474" y="124" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="40">TECH</text>
  </g>
  <rect x="214" y="142" width="330" height="8" rx="4" fill="#1E9AD6" opacity="0.85"/>
